global:
  # enabled is the master enabled switch. Setting this to true or false
  # will enable or disable all the components within this chart by default.
  enabled: true
injector:
  # True if you want to enable vault agent injection.
  # @default: global.enabled
  enabled: "false"

server:
  
  # Ingress resource is deployed in case enable_https_ingress variable is set to true
  ingress:
    enabled: ${ingress_enable}
    labels: {}
      # traffic: external
    annotations:
      alb.ingress.kubernetes.io/target-type: "ip"
      alb.ingress.kubernetes.io/load-balancer-name: "${ingress_lb_name}"
      alb.ingress.kubernetes.io/tags: "k8s_cluster=${k8s_cluster_name}"
      alb.ingress.kubernetes.io/scheme: "internet-facing"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/healthcheck-protocol: "HTTP"
      alb.ingress.kubernetes.io/healthcheck-port: "8200"
      alb.ingress.kubernetes.io/success-codes: 200,429,473
      alb.ingress.kubernetes.io/healthcheck-path: "/v1/sys/health"
      external-dns.alpha.kubernetes.io/hostname: vault.${ingress_hosted_zone}
      alb.ingress.kubernetes.io/certificate-arn: "${certificate_arn}"
      # |
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
      #   or
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"

    # Optionally use ingressClassName instead of deprecated annotation.
    # See: https://kubernetes.io/docs/concepts/services-networking/ingress/#deprecated-annotation
    ingressClassName: "alb"

    # As of Kubernetes 1.19, all Ingress Paths must have a pathType configured. The default value below should be sufficient in most cases.
    # See: https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types for other possible values.
    pathType: Prefix

    # When HA mode is enabled and K8s service registration is being used,
    # configure the ingress to point to the Vault active service.
    activeService: false
    hosts:
      - host: vault.${ingress_hosted_zone}
        paths: []
    ## Extra paths to prepend to the host configuration. This is useful when working with annotation based services.
    extraPaths: []
    # - path: /*
    #   backend:
    #     service:
    #       name: ssl-redirect
    #       port:
    #         number: use-annotation
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # If true, or "-" with global.enabled true, Vault server will be installed.
  # See vault.mode in _helpers.tpl for implementation details.
  enabled: "true"

  # [Enterprise Only] This value refers to a Kubernetes secret that you have
  # created that contains your enterprise license. If you are not using an
  # enterprise image or if you plan to introduce the license key via another
  # route, then leave secretName blank ("") or set it to null.
  # Requires Vault Enterprise 1.8 or later.
  enterpriseLicense:
    # The name of the Kubernetes secret that holds the enterprise license. The
    # secret must be in the same namespace that Vault is installed into.
    secretName: "vault-ent-license"
    # The key within the Kubernetes secret that holds the enterprise license.
    secretKey: "license"

  # Resource requests, limits, etc. for the server cluster placement. This
  # should map directly to the value of the resources field for a PodSpec.
  # By default no direct resource request is made.

  image:
    repository: "${vault_repository}"
    tag: "${vault_version_and_type}"
    # Overrides the default Image Pull Policy
    pullPolicy: IfNotPresent

  # Configure the Update Strategy Type for the StatefulSet
  # See https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
  updateStrategyType: "OnDelete"

  authDelegator:
    enabled: true

  # extraInitContainers is a list of init containers. Specified as a YAML list.
  # This is useful if you need to run a script to provision TLS certificates or
  # write out configuration files in a dynamic way.
  extraInitContainers: 
  - name: git-clone
    image: alpine/git
    args:
      - clone
      - --single-branch
      - --depth=1
      - --
      - ${git_repository}
      - /vault/tf-provision
    securityContext:
      runAsUser: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tf-provision
      mountPath: /vault/tf-provision
    # This just does an init of TF, so the TF inside the main container can configure Vault
  - name: terraform-vault-provision-initialization
    image: hashicorp/terraform:1.7.4
    command: ["/bin/sh", "-c"]
    args:
      - |
        terraform -chdir=/vault/tf-provision init -input=false \
          -backend-config="namespace=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
    securityContext:
      runAsUser: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tf-provision
      mountPath: /vault/tf-provision
    - name: tmp
      mountPath: /tmp
  readinessProbe:
    enabled: true
    # If you need to use a http path instead of the default exec
    # path: /v1/sys/health?standbyok=true

    # Port number on which readinessProbe will be checked.
    port: 8200
    # Allow enough time for Raft quorum to form, KMS unseal to complete,
    # and postStart init/apply to finish before giving up (30 * 5s = 150s window)
    failureThreshold: 30
    # Number of seconds after the container has started before probe initiates
    initialDelaySeconds: 15
    # How often (in seconds) to perform the probe
    periodSeconds: 5
    # Minimum consecutive successes for the probe to be considered successful after having failed
    successThreshold: 1
    # Number of seconds after which the probe times out.
    timeoutSeconds: 3
  # Used to enable a livenessProbe for the pods

  # Used to define commands to run after the pod is ready.
  # This can be used to automate processes such as initialization
  # or boostrapping auth methods.
  postStart: 
    - /bin/sh
    - -c
    - /vault/userconfig/run.sh

  # extraEnvironmentVars is a list of extra environment variables to set with the stateful set. These could be
  # used to include variables required for auto-unseal.
  extraEnvironmentVars:
    #Defining variables used to provision Vault by TF
    TF_VAR_DEMOROLE_POLICY_ARN: ${TF_VAR_DEMOROLE_POLICY_ARN}
    TF_VAR_DEMOROLE_ROLE_ARN: ${TF_VAR_DEMOROLE_ROLE_ARN}
    TF_VAR_ROLE_NAME: ${TF_VAR_ROLE_NAME}
    TF_VAR_ALLOWED_ARN_ROLE_LOGIN: ${TF_VAR_ALLOWED_ARN_ROLE_LOGIN}
    TF_VAR_INFERRED_AWS_REGION: ${TF_VAR_INFERRED_AWS_REGION}
    TF_VAR_BOUND_VPC_IDS: ${TF_VAR_BOUND_VPC_IDS}
 
  volumes:
    - name: vault-init-config
      configMap:
        name: vault-init-config
        defaultMode: 0550 # owner+group execute only; world-writable (0777) is a security risk for an executable script in a multi-tenant cluster
    #Volume which contains TF configuration for configuring the Vault server, usually a GitHub repo
    - name: tf-provision
      emptyDir: {}
    #Volume used as /tmp for Terraform container, so it can download providers
    - name: tmp
      emptyDir: {}
  # volumeMounts is a list of volumeMounts for the main server container. These are rendered
  # via toYaml rather than pre-processed like the extraVolumes value.
  # The purpose is to make it easy to share volumes between containers.
  volumeMounts: 
    - mountPath: /vault/userconfig
      name: vault-init-config
    - name: tf-provision
      mountPath: /vault/tf-provision
        
  # Affinity Settings
  # Commenting out or setting as empty the affinity variable, will allow
  # deployment to single node services such as Minikube
  # This should be either a multi-line string or YAML matching the PodSpec's affinity field.
  affinity: {}

  # Enables a headless service to be used by the Vault Statefulset
  service:
    enabled: true
    # Enable or disable the vault-active service, which selects Vault pods that
    # have labeled themselves as the cluster leader with `vault-active: "true"`.
    active:
      enabled: true
      # Extra annotations for the service definition. This can either be YAML or a
      # YAML-formatted multi-line templated string map of the annotations to apply
      # to the active service.
      annotations: {}
    # Enable or disable the vault-standby service, which selects Vault pods that
    # have labeled themselves as a cluster follower with `vault-active: "false"`.
    standby:
      enabled: true
      # Extra annotations for the service definition. This can either be YAML or a
      # YAML-formatted multi-line templated string map of the annotations to apply
      # to the standby service.
      annotations: {}
    # If enabled, the service selectors will include `app.kubernetes.io/instance: {{ .Release.Name }}`
    # When disabled, services may select Vault pods not deployed from the chart.
    # Does not affect the headless vault-internal service with `ClusterIP: None`
  dataStorage:
    enabled: true
    # Size of the PVC created
    size: 1Gi
    # Location where the PVC will be mounted.
    mountPath: "/vault/data"
    # Name of the storage class to use.  If null it will use the
    # configured default Storage Class.
    storageClass: null
    # Access Mode of the storage device being used for the PVC
    accessMode: ReadWriteOnce
    # Annotations to apply to the PVC
    annotations: {}
    # Labels to apply to the PVC
    labels: {}

  # Persistent Volume Claim (PVC) retention policy
  # ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
  # Example:
  # persistentVolumeClaimRetentionPolicy:
  #   whenDeleted: Retain
  #   whenScaled: Retain
  persistentVolumeClaimRetentionPolicy: 
    whenDeleted: Delete
  # Removing the PVs when Vault Helm in uninstalled

  ha:
    enabled: true
    replicas: 3

    # Set the api_addr configuration for Vault HA
    # See https://developer.hashicorp.com/vault/docs/configuration#api_addr
    # If set to null, this will be set to the Pod IP Address
    apiAddr: null

    # Set the cluster_addr confuguration for Vault HA
    # See https://developer.hashicorp.com/vault/docs/configuration#cluster_addr
    # If set to null, this will be set to https://$(HOSTNAME).{{ template "vault.fullname" . }}-internal:8201
    clusterAddr: null

    # Enables Vault's integrated Raft storage.  Unlike the typical HA modes where
    # Vault's persistence is external (such as Consul), enabling Raft mode will create
    # persistent volumes for Vault to store data according to the configuration under server.dataStorage.
    # The Vault cluster will coordinate leader elections and failovers internally.
    raft:

      # Enables Raft integrated storage
      enabled: true
      # Set the Node Raft ID to the name of the pod
      setNodeId: true

      # Note: Configuration files are stored in ConfigMaps so sensitive data
      # such as passwords should be either mounted through extraSecretEnvironmentVars
      # or through a Kube secret.  For more information see:
      # https://developer.hashicorp.com/vault/docs/platform/k8s/helm/run#protecting-sensitive-vault-configurations
      config: |
        ui = true
        raw_storage_endpoint = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }
        
        telemetry {
          disable_hostname = true
          prometheus_retention_time = "12h"
        }

        storage "raft" {
          path = "/vault/data"
      
          retry_join {
            auto_join = "provider=k8s namespace=\"{{ .Release.Namespace }}\" label_selector=\"component=server, app.kubernetes.io/name=vault\""
              auto_join_scheme      = "http"
          }
        }
        service_registration "kubernetes" {}

        seal "awskms" {
        kms_key_id = "${kms_key_id}"
        }

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "${sa_name}"
    # Create a Secret API object to store a non-expiring token for the service account.
    # Prior to v1.24.0, Kubernetes used to generate this secret for each service account by default.
    # Kubernetes now recommends using short-lived tokens from the TokenRequest API or projected volumes instead if possible.
    # For more details, see https://kubernetes.io/docs/concepts/configuration/secret/#service-account-token-secrets
    # serviceAccount.create must be equal to 'true' in order to use this feature.
    createSecret: false
    # Extra annotations for the serviceAccount definition. This can either be
    # YAML or a YAML-formatted multi-line templated string map of the
    # annotations to apply to the serviceAccount.
    annotations: 
      eks.amazonaws.com/role-arn: "${vault_server_aws_role}" # Mapping this SA to AWS IAM ROLE

    serviceDiscovery:
      enabled: true
# Configuring ServiceMonitor resource to be used with the Prometheus operator
# Keep in mind that Prometheus resource should be in the same namespace as Vault
# Otherwise specify serviceMonitorNamespaceSelector: {} in the Prometheus object
serverTelemetry:
  # Configuration for monitoring the Vault server.
  serviceMonitor:
    # The Prometheus operator *must* be installed before enabling this feature,
    # if not the chart will fail to install due to missing CustomResourceDefinitions
    # provided by the operator.
    #
    # Instructions on how to install the Helm chart can be found here:
    #  https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
    # More information can be found here:
    #  https://github.com/prometheus-operator/prometheus-operator
    #  https://github.com/prometheus-operator/kube-prometheus

    # Enable deployment of the Vault Server ServiceMonitor CustomResource.
    enabled: ${enable_prometheus_servicemonitor}

    # Selector labels to add to the ServiceMonitor.
    # When empty, defaults to:
    #  release: prometheus
    selectors: 
      release: prometheus

    # Interval at which Prometheus scrapes metrics
    interval: 30s

    # Timeout for Prometheus scrapes
    scrapeTimeout: 10s

    # tlsConfig used for scraping the Vault metrics API.
    # See API reference: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.TLSConfig
    # example:
    # tlsConfig:
    #   ca:
    #     secret:
    #       name: vault-metrics-client
    #       key: ca.crt
    tlsConfig: {}

    # authorization used for scraping the Vault metrics API.
    # See API reference: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.SafeAuthorization
    # example:
    # authorization:
    #   credentials:
    #     name: vault-metrics-client
    #     key: token
    authorization: {}
    # Selecting all Vault instances, NOT just the active one
    matchLabels: {
      vault-internal: "true"
    }
  prometheusRules:
      # The Prometheus operator *must* be installed before enabling this feature,
      # if not the chart will fail to install due to missing CustomResourceDefinitions
      # provided by the operator.

      # Deploy the PrometheusRule custom resource for AlertManager based alerts.
      # Requires that AlertManager is properly deployed.
      enabled: true

      # Selector labels to add to the PrometheusRules.
      # When empty, defaults to:
      #  release: prometheus
      selectors: 
        release: prometheus

      # Some example rules.
      rules:
        - alert: vault-HighResponseTime
          # Fires when the p50 (median) request latency on the active node exceeds 500ms for 5 minutes.
          # Filtered to vault_active="true" so standbys (which forward requests and have higher
          # inherent latency) do not generate noise. Indicates the active node is under load or degraded.
          annotations:
            summary: Vault high response time (instance {{ $labels.instance }})
            description: "Response time p50 > 500ms on {{ $labels.instance }}\n  VALUE = {{ $value | printf \"%.2f\" }}ms"
          expr: vault_core_handle_request{quantile="0.5", vault_active="true"} > 500
          for: 5m
          labels:
            severity: warning
        - alert: vault-CriticalResponseTime
          # Fires when the p50 request latency on the active node exceeds 1s for 5 minutes.
          # At this threshold clients are likely experiencing timeouts. Investigate storage I/O,
          # KMS latency, or CPU saturation on the active pod.
          annotations:
            summary: Vault critical response time (instance {{ $labels.instance }})
            description: "Response time p50 > 1s on {{ $labels.instance }}\n  VALUE = {{ $value | printf \"%.2f\" }}ms"
          expr: vault_core_handle_request{quantile="0.5", vault_active="true"} > 1000
          for: 5m
          labels:
            severity: critical
        - alert: VaultSealed
          # Fires when a Vault pod reports sealed state for more than 2 minutes.
          # for: 2m provides a buffer for KMS auto-unseal to complete on pod startup —
          # pods briefly pass through sealed state before AWS KMS responds.
          # If this fires and persists, check KMS connectivity and vault operator unseal status.
          expr: vault_core_unsealed == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Vault sealed (instance {{ $labels.instance }})
            description: "Vault instance is sealed on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: VaultTooManyPendingTokens
          # Fires when more than 100 tokens are created but not yet stored within a 5 minute window.
          # Uses increase() on counters rather than raw subtraction to avoid always-positive false positives.
          # A sustained backlog indicates the token store (Raft storage) is falling behind creation rate.
          expr: increase(vault_token_create_count[5m]) - increase(vault_token_store_count[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Vault too many pending tokens (instance {{ $labels.instance }})
            description: "Too many pending tokens {{ $labels.instance }}: {{ $value | printf \"%.2f\"}}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: VaultTooManyInfinityTokens
          # Fires when more than 3 non-expiring tokens (TTL=+Inf) exist.
          # Infinity tokens never expire and accumulate indefinitely — they are a security risk
          # as a compromised token cannot be expired by TTL. Investigate which auth methods
          # or manual token creates are generating them.
          expr: vault_token_count_by_ttl{creation_ttl="+Inf"} > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Vault too many infinity tokens (instance {{ $labels.instance }})
            description: "Too many infinity tokens {{ $labels.instance }}: {{ $value | printf \"%.2f\"}}%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: VaultClusterDegraded
          # Fires when fewer than 3 pods are reporting the vault_core_active metric for 10 minutes.
          # Note: vault_core_active is 1 on the leader and 0 on standbys — only 1 pod is ever
          # "active" at a time. count() here counts how many pods are reporting the metric at all,
          # regardless of its value. A count < 3 means one or more pods have stopped reporting
          # (crashed, evicted, or not yet joined Raft).
          # for: 10m avoids false positives during initial startup when pods join sequentially.
          expr: count(vault_core_active) < 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Vault cluster degraded
            description: "One or more Vault pods have stopped reporting metrics\n  REPORTING PODS = {{ $value }}"
        - alert: VaultRaftNoLeader
          # Fires when no Vault pod reports itself as the active (leader) node for 1 minute.
          # This means the Raft cluster has lost quorum and Vault is completely unavailable for writes.
          # Immediate action required — check pod status, Raft peer list, and KMS connectivity.
          expr: sum(vault_core_active) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Vault Raft has no leader
            description: "No active Vault leader elected for over 1 minute\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: VaultRaftReplicationLag
          # Fires when Raft appendEntries RTT p99 exceeds 2 seconds for 5 minutes on any standby.
          # High replication lag means standbys are falling behind the leader — can be caused by
          # network latency, slow EBS volumes, or the standby pod being CPU/memory starved.
          expr: vault_raft_replication_appendEntries_rtt_ms{quantile="0.99"} > 2000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Vault Raft replication lag (instance {{ $labels.instance }})
            description: "Raft replication RTT p99 > 2s on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: VaultRequestErrors
          # Fires when more than 10 request errors are recorded in a 5 minute window on any instance.
          # vault_core_handle_request_count{status="error"} is incremented for every request
          # that Vault returns an error response for (4xx/5xx). A sustained spike indicates
          # client misconfiguration, auth failures, or an overloaded/degraded Vault node.
          expr: increase(vault_core_response_status_code{type=~"4xx|5xx"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Vault request errors (instance {{ $labels.instance }})
            description: "More than 10 request errors in 5m on {{ $labels.instance }}\n  VALUE = {{ $value | printf \"%.0f\" }}"